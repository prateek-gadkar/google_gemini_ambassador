<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calibrate certificate · Admin</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="accent-strip" aria-hidden="true"></div>

<header class="appbar">
  <a class="brand" href="/admin" aria-label="Admin console">
    <img class="brand-google" src="/brand/google-g-64.png" alt="Google" width="26" height="26">
    <span class="brand-rule" aria-hidden="true"></span>
    <img class="brand-sparkle" src="/brand/gemini-sparkle.png" alt="Gemini" width="24" height="24">
    <span class="brand-text">
      <strong>Calibrate the certificate</strong>
      <span>Drag each blank into place on the real artwork</span>
    </span>
  </a>
  <div class="appbar-actions">
    <a class="plain-link" href="/admin">Back to admin</a>
  </div>
</header>

<div class="wrap">

  <div id="msg" class="banner hidden"></div>

  <section id="keyPanel" class="hidden">
    <div class="card">
      <h2><span class="ico-lead" data-icon="key" data-icon-size="20"></span>Admin key required</h2>
      <label class="field">
        <span>Key</span>
        <input type="password" id="adminKey" autocomplete="off" placeholder="Paste the admin key">
      </label>
      <button class="primary" type="button" id="btnUnlock">Unlock</button>
    </div>
  </section>

  <section id="panel" class="hidden">

    <div class="card">
      <div class="row" id="fieldPicker" style="margin-bottom:12px">
        <button class="primary small" type="button" data-field="name">Name</button>
        <button class="ghost small" type="button" data-field="date">Date</button>
        <button class="ghost small" type="button" data-field="signature">Signature</button>
      </div>
      <div id="stageWrap" style="position:relative;line-height:0">
        <canvas id="stage" style="width:100%;cursor:crosshair;touch-action:none"></canvas>
      </div>
      <p class="tiny" style="margin-top:10px" id="stageHint"></p>
      <div class="row" style="margin-top:10px">
        <button class="ghost small" type="button" id="btnPreview" data-icon="download" data-icon-size="16">Download preview PNG</button>
        <span class="tiny">The preview shows a sample name and today's date. Neither is ever saved.</span>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico-lead" data-icon="tune" data-icon-size="20"></span>Adjust <span class="tiny" id="activeLabel"></span></h2>

      <div class="split" id="textControls">
        <label class="field">
          <span>Font size <span class="tiny mono" id="sizeVal"></span></span>
          <input type="range" id="size" min="0.5" max="10" step="0.1">
        </label>
        <label class="field">
          <span>Max width <span class="tiny mono" id="maxVal"></span></span>
          <input type="range" id="maxWidth" min="2" max="100" step="1">
        </label>
        <label class="field">
          <span>Font</span>
          <select id="font">
            <option value="google">Google Sans (official)</option>
            <option value="sans">Sans-serif fallback</option>
            <option value="serif">Serif</option>
          </select>
        </label>
        <label class="field">
          <span>Weight</span>
          <select id="weight">
            <option value="400">Regular</option>
            <option value="500">Medium</option>
            <option value="600">Semibold</option>
            <option value="700">Bold</option>
          </select>
        </label>
        <label class="field">
          <span>Alignment</span>
          <select id="align">
            <option value="center">Centre</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </label>
        <label class="field">
          <span>Colour</span>
          <input type="color" id="color" style="height:42px;padding:4px">
        </label>
      </div>

      <div class="split hidden" id="sigControls">
        <label class="field">
          <span>Signature width <span class="tiny mono" id="sigWVal"></span></span>
          <input type="range" id="sigWidth" min="1" max="60" step="0.5">
        </label>
        <label class="field">
          <span>Opacity <span class="tiny mono" id="sigOVal"></span></span>
          <input type="range" id="sigOpacity" min="10" max="100" step="1">
        </label>
      </div>

      <div class="row" style="margin-top:6px">
        <button class="primary" type="button" id="btnEnable">Save and enable downloads</button>
        <button class="ghost" type="button" id="btnSave">Save only</button>
        <button class="ghost small danger" type="button" id="btnDisable">Disable downloads</button>
      </div>
      <div class="msg" id="saveMsg"></div>
      <p class="tiny" id="readiness" style="margin-top:10px"></p>
    </div>
  </section>

</div>
<script src="/icons.js"></script>
<script src="/cert-render.js"></script>
<script src="/calibrate.js"></script>
</body>
</html>
