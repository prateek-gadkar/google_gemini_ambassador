<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game On Night — Session Timer</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#121821; --line:#1f2a37; --ink:#f3f5f7; --muted:#8b98a8;
    --accent:#4285f4; --go:#34a853; --warn:#fbbc04; --hot:#ea4335;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  body.flash{animation:fl .8s ease}
  @keyframes fl{0%,100%{background:var(--bg)}35%{background:#1d2a3f}}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .totals{display:flex;gap:26px;align-items:baseline}
  .totals .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .totals .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 320px;min-height:0}
  @media (max-width:900px){main{grid-template-columns:1fr}}

  .stage{
    display:flex;flex-direction:column;justify-content:center;
    padding:32px 40px;min-height:0;position:relative;
  }
  .now-label{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:10px;
  }
  .now-label b{color:var(--accent)}
  .seg-title{
    font-size:clamp(28px,5vw,62px);line-height:1.05;font-weight:700;letter-spacing:-.02em;
    margin-bottom:14px;
  }
  .seg-note{
    font-size:clamp(13px,1.5vw,19px);color:var(--muted);line-height:1.5;
    max-width:52ch;margin-bottom:22px;
  }
  .clock{
    font-size:clamp(64px,17vw,190px);line-height:.9;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.04em;
    transition:color .25s;
  }
  .clock.ok{color:var(--go)} .clock.warn{color:var(--warn)} .clock.hot{color:var(--hot)}
  .clock.over{color:var(--hot);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.45}}

  .bar{height:6px;background:#182231;border-radius:99px;overflow:hidden;margin-top:26px;max-width:760px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s linear}
  .bar>i.warn{background:var(--warn)} .bar>i.hot{background:var(--hot)}

  .next{
    margin-top:20px;font-size:clamp(13px,1.4vw,17px);color:var(--muted);
  }
  .next b{color:#cdd6e1;font-weight:600}

  aside{
    border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto;min-height:0;
  }
  aside h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:4px 0 10px}
  ol.segs{list-style:none;display:flex;flex-direction:column;gap:2px}
  ol.segs li{
    display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:7px;
    font-size:13px;color:var(--muted);cursor:pointer;line-height:1.3;
  }
  ol.segs li:hover{background:#1a222e;color:var(--ink)}
  ol.segs li .t{font-variant-numeric:tabular-nums;font-size:11.5px;color:#5d6b7c;min-width:38px}
  ol.segs li.done{opacity:.42}
  ol.segs li.done .t::after{content:" ✓";color:var(--go)}
  ol.segs li.active{background:#1b2b45;color:#fff;font-weight:600}
  ol.segs li.active .t{color:var(--accent)}

  footer{
    border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap;flex:0 0 auto;
  }
  button{
    font:inherit;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:9px;
    border:1px solid var(--line);background:#161e29;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  button:hover{background:#1d2734;border-color:#2c3a4d}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:118px}
  button.primary:hover{background:#3367d6}
  button.primary.paused{background:var(--go);border-color:var(--go)}
  .spacer{flex:1}
  .hint{font-size:11.5px;color:#5d6b7c}
  .hint kbd{
    background:#1a222e;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-family:inherit;font-size:11px;color:#9aa7b8;
  }
  @media (max-width:900px){
    .stage{padding:22px 18px}
    aside{border-left:0;border-top:1px solid var(--line);max-height:34vh}
    .hint{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Game On Night · Session Timer</div>
  <div class="totals">
    <div><div class="k">Elapsed</div><div class="v" id="hElapsed">00:00</div></div>
    <div><div class="k">Remaining</div><div class="v" id="hRemain">60:00</div></div>
  </div>
</header>

<main>
  <section class="stage">
    <div class="now-label">Now &middot; segment <b id="segNo">1</b> of <b id="segTot">12</b></div>
    <h1 class="seg-title" id="segTitle">Recording ON + welcome</h1>
    <p class="seg-note" id="segNote">—</p>
    <div class="clock ok" id="clock">03:00</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="next">Next up &middot; <b id="nextSeg">—</b></div>
  </section>

  <aside>
    <h3>Run of show</h3>
    <ol class="segs" id="segs"></ol>
  </aside>
</main>

<footer>
  <button class="primary" id="btnStart">Start</button>
  <button id="btnNext">Next segment</button>
  <button id="btnReset">Reset</button>
  <div class="spacer"></div>
  <button id="btnSound" title="Toggle the chime">Chime: on</button>
  <button id="btnFull">Fullscreen</button>
  <span class="hint"><kbd>space</kbd> start/pause &nbsp; <kbd>→</kbd> next &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>F</kbd> fullscreen</span>
</footer>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- schedule
     Minutes from the official Game On Night run of show. Total = 60. */
  var SCHEDULE = [
    { t:"Recording ON + welcome",       d:180, n:"Hit record BEFORE anyone joins. Cameras on. Everyone renames to their real name." },
    { t:"Self-intro on camera",          d:120, n:"Name, designation, campus, GID. Say it clearly — this segment gets reviewed." },
    { t:"Pre-survey",                    d:300, n:"Link in chat. Wait in silence until everyone has submitted. Do not skip ahead." },
    { t:"What is Google Play Arena",     d:360, n:"6 games, 6 clubs, MS Dhoni's Mahi Clutchers. Registrations close 29 Nov." },
    { t:"Read the brief",                d:180, n:"One goal, one enemy, one deadline. Imagine the Impossible." },
    { t:"Live demo — Gemini prompt",     d:360, n:"Run the prompt on screen. Let them watch an idea appear in real time." },
    { t:"Build time",                    d:1200, n:"Game doc first, then the Nano Banana poster. Music on, roam the call, unblock people." },
    { t:"Pitches — 60 sec each",         d:600, n:"Strict timer. Poster on screen, doc ready. Applaud after every one." },
    { t:"Room vote",                     d:120, n:"Would Play / Wouldn't Play. Announce the winners out loud." },
    { t:"Register + feedback form",      d:120, n:"goo.gle/GooglePlayArena-StudentAmbassadors — everyone before they leave." },
    { t:"Group photo + stop recording",  d:60,  n:"Cameras on in the frame. THEN stop the recording." }
  ];

  var TOTAL = SCHEDULE.reduce(function(a,s){ return a + s.d; }, 0);

  /* ---------------------------------------------------------------- state */
  var i = 0;              // current segment index
  var left = SCHEDULE[0].d; // seconds left in current segment
  var running = false;
  var last = 0;           // timestamp of last tick
  var soundOn = true;
  var finished = false;

  var $ = function(id){ return document.getElementById(id); };

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function elapsed(){
    var e = 0;
    for (var k = 0; k < i; k++) e += SCHEDULE[k].d;
    return e + (SCHEDULE[i].d - Math.max(0, left));
  }

  /* ---------------------------------------------------------------- chime */
  var actx = null;
  function beep(freq, dur, vol){
    if (!soundOn) return;
    try{
      if (!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(actx.destination);
      var t0 = actx.currentTime;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0); o.stop(t0 + dur);
    }catch(e){ /* audio is a nicety, never a failure */ }
  }

  /* ---------------------------------------------------------------- render */
  function buildList(){
    var ol = $("segs");
    ol.innerHTML = "";
    SCHEDULE.forEach(function(s, idx){
      var li = document.createElement("li");
      li.setAttribute("data-idx", String(idx));
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = fmt(s.d);
      var name = document.createElement("span");
      name.textContent = s.t;
      li.appendChild(t); li.appendChild(name);
      li.addEventListener("click", function(){ jump(idx); });
      ol.appendChild(li);
    });
    $("segTot").textContent = String(SCHEDULE.length);
  }

  function render(){
    var s = SCHEDULE[i];
    $("segNo").textContent = String(i + 1);
    $("segTitle").textContent = s.t;
    $("segNote").textContent = s.n;

    var disp = left;
    var clk = $("clock");
    clk.textContent = (left < 0 ? "+" : "") + fmt(Math.abs(disp));
    clk.className = "clock " + (left < 0 ? "over" : left <= 30 ? "hot" : left <= 90 ? "warn" : "ok");

    var bar = $("bar");
    var pct = s.d > 0 ? Math.min(100, ((s.d - Math.max(0, left)) / s.d) * 100) : 100;
    bar.style.width = pct + "%";
    bar.className = left < 0 ? "hot" : left <= 30 ? "hot" : left <= 90 ? "warn" : "";

    $("hElapsed").textContent = fmt(elapsed());
    $("hRemain").textContent = fmt(TOTAL - elapsed());

    var nx = i + 1 < SCHEDULE.length ? SCHEDULE[i + 1].t : "Done — stop the recording and thank everyone";
    $("nextSeg").textContent = nx;

    var items = $("segs").children;
    for (var k = 0; k < items.length; k++){
      var li = items[k];
      li.classList.toggle("active", k === i);
      li.classList.toggle("done", k < i);
    }

    var btn = $("btnStart");
    btn.textContent = running ? "Pause" : (left === SCHEDULE[i].d && i === 0 ? "Start" : "Resume");
    btn.classList.toggle("paused", running);
  }

  /* ---------------------------------------------------------------- control */
  function advance(){
    if (i >= SCHEDULE.length - 1){
      running = false;
      finished = true;
      left = 0;
      render();
      beep(660, 0.35, 0.12);
      setTimeout(function(){ beep(880, 0.6, 0.12); }, 380);
      return;
    }
    i += 1;
    left = SCHEDULE[i].d;
    beep(880, 0.16, 0.09);
    flash();
    render();
  }

  function jump(idx){
    if (idx < 0 || idx >= SCHEDULE.length) return;
    i = idx;
    left = SCHEDULE[i].d;
    finished = false;
    render();
  }

  function flash(){
    document.body.classList.remove("flash");
    void document.body.offsetWidth;   // force reflow so the animation replays
    document.body.classList.add("flash");
    setTimeout(function(){ document.body.classList.remove("flash"); }, 820);
  }

  function tick(now){
    if (!running){ last = now; return; }
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;   // real elapsed time, so the clock never drifts behind
    left -= dt;

    if (left <= 0){
      // warn once at zero, then keep counting into overtime until the host moves on
      if (left > -0.25) beep(440, 0.25, 0.1);
      if (left < -180){ advance(); }
    }
    render();
  }

  function loop(){
    tick(performance.now());
    requestAnimationFrame(loop);
  }

  /* ---------------------------------------------------------------- wiring */
  $("btnStart").addEventListener("click", function(){
    if (finished){ i = 0; left = SCHEDULE[0].d; finished = false; }
    running = !running;
    last = performance.now();
    if (running && actx && actx.state === "suspended") actx.resume();
    render();
  });

  $("btnNext").addEventListener("click", function(){ advance(); });

  $("btnReset").addEventListener("click", function(){
    running = false; i = 0; left = SCHEDULE[0].d; finished = false; render();
  });

  $("btnSound").addEventListener("click", function(){
    soundOn = !soundOn;
    this.textContent = "Chime: " + (soundOn ? "on" : "off");
    if (soundOn) beep(660, 0.12, 0.08);
  });

  $("btnFull").addEventListener("click", function(){
    var el = document.documentElement;
    if (!document.fullscreenElement){
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    } else if (document.exitFullscreen){
      document.exitFullscreen();
    }
  });

  document.addEventListener("fullscreenchange", function(){
    $("btnFull").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

  document.addEventListener("keydown", function(e){
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var k = e.key;
    if (k === " " || k === "Spacebar"){ e.preventDefault(); $("btnStart").click(); }
    else if (k === "ArrowRight"){ e.preventDefault(); advance(); }
    else if (k === "ArrowLeft"){ e.preventDefault(); jump(i - 1); }
    else if (k === "r" || k === "R"){ $("btnReset").click(); }
    else if (k === "m" || k === "M"){ $("btnSound").click(); }
    else if (k === "f" || k === "F"){ $("btnFull").click(); }
  });

  // keep the screen awake on a projector, where the API allows it
  if ("wakeLock" in navigator && navigator.wakeLock.request){
    navigator.wakeLock.request("screen").catch(function(){});
  }

  buildList();
  render();
  last = performance.now();
  requestAnimationFrame(loop);

  // expose for the test harness
  window.__timer = { SCHEDULE: SCHEDULE, TOTAL: TOTAL };
})();
</script>
</body>
</html>
